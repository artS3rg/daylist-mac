name: Release Apple Silicon app
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Build and verify app bundle
        run: |
          app="$RUNNER_TEMP/Дела.app"
          mkdir -p "$app/Contents/MacOS"
          cp Info.plist "$app/Contents/"
          plutil -lint "$app/Contents/Info.plist"
          xcrun swiftc -swift-version 5 -parse-as-library -O -target arm64-apple-macos13.0 Daylist.swift -o "$app/Contents/MacOS/Daylist"
          lipo -verify_arch arm64 "$app/Contents/MacOS/Daylist"
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"
          ditto -c -k --keepParent "$app" Daylist-Apple-Silicon.zip
          ditto -x -k Daylist-Apple-Silicon.zip "$RUNNER_TEMP/unpacked"
          codesign --verify --strict "$RUNNER_TEMP/unpacked/Дела.app"
          open "$RUNNER_TEMP/unpacked/Дела.app"
          sleep 3
          pgrep -x Daylist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" Daylist-Apple-Silicon.zip --verify-tag --title "Дела ${RELEASE_TAG#v}" --notes-file RELEASE.md
