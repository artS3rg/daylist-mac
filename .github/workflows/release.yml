name: Release Apple Silicon app
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Build and verify app bundle
        run: |
          app="$RUNNER_TEMP/Дела.app"
          xcrun swiftc -D TEST_REMINDERS -swift-version 5 -parse-as-library Daylist.swift RichNotes.swift WakeReminders.swift Tests/*.swift -o "$RUNNER_TEMP/check"
          "$RUNNER_TEMP/check"
          bash build.sh "$app"
          ditto -c -k --keepParent "$app" Daylist-Apple-Silicon.zip
          ditto -x -k Daylist-Apple-Silicon.zip /Applications
          installed="/Applications/Дела.app"
          codesign --verify --strict "$installed"
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$installed"
          "$installed/Contents/MacOS/Daylist" --check-background
          for slot in morning evening; do
            job="gui/$(id -u)/local.daylist.notebook.$slot"
            launchctl print "$job"
            launchctl kickstart "$job"
            for attempt in {1..15}; do
              state="$(launchctl print "$job")"
              if grep -q 'last exit code = 0' <<< "$state"; then break; fi
              sleep 1
            done
            grep 'last exit code = 0' <<< "$state"
          done
          open "$installed"
          sleep 3
          pgrep -x Daylist
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" Daylist-Apple-Silicon.zip --verify-tag --title "Дела ${RELEASE_TAG#v}" --notes-file RELEASE.md
